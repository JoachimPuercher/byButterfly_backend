# Local development only. Production runs the Dockerfile CMD on Railway.
# All values come from .env (gitignored); copy .env.example to get started.
#
# Two env files, both gitignored, both must define ENV_FILE with their own name:
#   .env          local Postgres in the db container      docker compose up
#   .env.railway  production Postgres on Railway          docker compose --env-file .env.railway up web worker redis
# --env-file only fills the ${...} placeholders below; env_file hands the
# same file to the containers. Do not start db with .env.railway.

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "(python manage.py createsuperuser --noinput || true) &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: ${ENV_FILE}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DEPLOY_BACKGROUND_WORKERS: "True"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false  # not started with .env.railway
      redis:
        condition: service_healthy

  # Phase 1: the worker runs only here, never on Railway. It reads and writes
  # the production database directly (POSTGRES_HOST = Railway TCP proxy).
  worker:
    build: .
    command: python manage.py rqworker default
    env_file: ${ENV_FILE}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DEPLOY_BACKGROUND_WORKERS: "True"
      # Where huggingface_hub keeps downloaded models. Stated here so the
      # mount below and the library's cache path are visibly the same thing.
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - .:/app
      # The whisper weights (~3 GB for large-v3), downloaded once and kept
      # across container rebuilds and `docker compose down`.
      - hf-cache:/home/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
        required: false  # not started with .env.railway
      redis:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
